<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Return to PAZ Shop</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f4f8f4; color: #173c2b; font: 16px system-ui, sans-serif; text-align: center; }
      main { max-width: 360px; }
      a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 8px; background: #166534; color: white; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Returning to PAZ Shop</h1>
      <p>Your payment is being verified. If the app does not reopen automatically, return to PAZ Shop and tap “Check payment”.</p>
      <a id="return-link" href="pazshop://payment-callback">Return to the app</a>
    </main>
    <script>
      const query = new URLSearchParams(window.location.search);
      const reference = query.get('reference') || query.get('trxref') || '';
      const target = `pazshop://payment-callback?reference=${encodeURIComponent(reference)}`;
      document.getElementById('return-link').href = target;
      window.location.replace(target);
    </script>
  </body>
</html>
